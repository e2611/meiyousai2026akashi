<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>課題</title>
        <link rel="stylesheet" href="task-design.css">
    </head>
    <body>
        
  <h1 class="backdesign">課題</h1>
  <a class="backtohome" href="calendar.html">クラス・学科選択に戻る</a>
  <div class="wrapper">
  <div class="input-area">
    <div class="task-area">
      <label for="task-input">課題名(必須)</label>
      <input type="text" class="task-input" id="task-input">
      <div class="error-msg">タスクを入力してください!</div>
    </div>
    <div class="date-area">
      <label for="date">期日</label>
      <input type="date" class="date" id="date">
    </div>
    <button class="btn add-btn">追加</button>
  </div>
  <div class="display-task">
   
    <ul class="task-list"></ul>
  </div>
</div>

<script src="task.js"></script>
    </body>
</html>
