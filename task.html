<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="task-design.css">
        <title>課題</title>
    </head>
    <body>
        <div class="wrapper">
            <h1>課題</h1>
            <div class="input-area">
                <div class="task-area">
                    <label for="task-input">課題名</label>
                    <input type="text" class="task-input" id="task-input">
                    <div class="error-msg">タスクを入力してください</div>
                </div>
                <div class="date-area">
                    <label for="date">期日</label>
                    <input type="date" class="date" id="date">
                </div>
                <button class="btn add-btn">課題の追加</button>
            </div>
            <dic class="display-task">
                <ul class="task-list"></ul>
            </dic>
        </div>
    </body>
</html>
